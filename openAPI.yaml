        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminProduct'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateProduct:
      type: object
      required:
        - subcategoryId
        - slug
        - name
        - description
        - price
        - imageUrls
        - sku
      additionalProperties: false
      properties:
        subcategoryId: *id005
        slug: *id006
        name: *id007
        description: *id008
        price: *id009
        imageUrls: *id010
        sku: *id012
    UpdateProduct:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        subcategoryId: *id005
        slug: *id006
        name: *id007
        description: *id008
        price: *id009
        imageUrls: *id010
        sku: *id012
        status: *id013
    Credentials:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email: &id014
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    RegisterCustomer:
      type: object
      required:
        - email
        - name
        - password
      additionalProperties: false
      properties:
        email: *id014
        name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
    Account:
      type: object
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email: *id014
        name:
          type: string
        role:
          type: string
          enum:
            - customer
            - admin
    AccessToken:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Seconds until the token expires.
    Inventory:
      type: object
      required:
        - productId
        - onHand
        - reserved
        - available
        - version
      properties:
        productId:
          $ref: '#/components/schemas/Id'
        onHand:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
          description: On-hand stock less reserved stock.
        version:
          type: integer
          minimum: 1
    SetInventory:
      type: object
      required:
        - onHand
        - version
      additionalProperties: false
      properties:
        onHand:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
    SetCartItem:
      type: object
      required:
        - quantity
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
    CartItem:
      type: object
      required:
        - productId
        - name
        - quantity
        - unitPrice
        - lineTotal
        - available
      properties:
        productId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean
          description: Whether the selected quantity is currently purchasable.
    Cart:
      type: object
      description: Amounts use the store’s configured checkout currency.
      required:
        - items
        - subtotal
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          $ref: '#/components/schemas/Money'
    ShippingAddress:
      type: object
      required:
        - recipientName
        - phone
        - line1
        - city
        - countryCode
      additionalProperties: false
      properties:
        recipientName:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 1
          maxLength: 32
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 120
        region:
          type: string
          maxLength: 120
        postalCode:
          type: string
          maxLength: 24
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 country code.
    ShippingOption:
      type: object
      required:
        - code
        - name
        - price
      properties:
        code:
          type: string
          minLength: 1
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
    CreateOrder:
      type: object
      required:
        - shippingAddress
        - shippingOptionCode
      additionalProperties: false
      properties:
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        shippingOptionCode:
          type: string
          minLength: 1
          description: Code returned by the shipping options endpoint.
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
    OrderItem:
      type: object
      required:
        - productId
        - sku
        - name
        - quantity
        - unitPrice
        - lineTotal
      properties:
        productId:
          $ref: '#/components/schemas/Id'
        sku:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
    SetShipment:
      type: object
      required:
        - carrier
        - trackingNumber
      additionalProperties: false
      properties:
        carrier: &id015
          type: string
          minLength: 1
          maxLength: 120
        trackingNumber: &id016
          type: string
          minLength: 1
          maxLength: 120
        trackingUrl: &id017
          type: string
          format: uri
    Shipment:
      type: object
      required:
        - carrier
        - trackingNumber
        - shippedAt
      properties:
        carrier: *id015
        trackingNumber: *id016
        trackingUrl: *id017
        shippedAt:
          type: string
          format: date-time
    Order:
      type: object
      description: Items, shipping, and prices reflect the values captured when the order was placed.
        Total includes shipping and tax.
      required:
        - id
        - customerId
        - status
        - items
        - shippingAddress
        - shippingOption
        - subtotal
        - tax
        - total
        - createdAt
        - paymentDueAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        customerId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
            - awaiting_payment
            - paid
            - shipped
            - expired
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          minItems: 1
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        shippingOption:
          $ref: '#/components/schemas/ShippingOption'
        subtotal:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
        paymentDueAt:
          type: string
          format: date-time
          description: Deadline for paying this order.
        shipment:
          $ref: '#/components/schemas/Shipment'
    OrderPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          $ref: '#/components/schemas/PageInfo'
    Payment:
      type: object
      required:
        - id
        - orderId
        - status
        - amount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        orderId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - expired
        amount:
          $ref: '#/components/schemas/Money'
        checkoutUrl:
          type: string
          format: uri
          description: Hosted checkout URL for an open payment attempt.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token issued at sign-in. Management operations and views require the admin role.
  parameters:
    CategorySlug:
      name: categorySlug
      in: path
      description: Configured category slug.
      required: true
      schema:
        $ref: '#/components/schemas/CategorySlug'
    CategoryFilter:
      name: categorySlug
      in: query
      description: Filter by configured category slug.
      schema:
        $ref: '#/components/schemas/CategorySlug'
    SubcategoryFilter:
      name: subcategoryId
      in: query
      description: Filter by subcategory. Combine with categorySlug to narrow results.
      schema:
        $ref: '#/components/schemas/Id'
    Page:
      name: page
      in: query
      description: Page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Maximum items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SubcategoryId:
      name: subcategoryId
      in: path
      description: Subcategory ID.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ProductId:
      name: productId
      in: path
      description: Product ID.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OrderId:
      name: orderId
      in: path
      description: Order ID.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PaymentId:
      name: paymentId
      in: path
      description: Payment ID.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Admin access required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource unavailable or outside the caller’s account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The requested change conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: The payment provider is temporarily unavailable. The request may be retried.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
